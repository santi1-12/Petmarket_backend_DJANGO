{% extends 'base.html' %}
{% block title %}Confirmar eliminación{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h3>Eliminar producto</h3>
          <p>¿Seguro que deseas eliminar <strong>{{ producto.nombre }}</strong>?</p>
          <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Sí, eliminar</button>
            <a class="btn btn-secondary" href="/productos/{{ producto.pk }}/">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
