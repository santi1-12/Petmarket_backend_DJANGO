<h5>Clientes</h5>
<form method="get" class="mb-2">
  <input type="text" name="q" value="{{ q }}" placeholder="Buscar cliente..." class="form-control" style="max-width:300px;display:inline-block">
  <button class="btn btn-primary btn-sm">Buscar</button>
  <a href="{% url 'empleados:cliente_create' %}" class="btn btn-success btn-sm">Agregar cliente</a>
</form>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Email</th>
      <th>Teléfono</th>
      <th>Dirección</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for c in clientes %}
    <tr>
      <td>{{ c.nombre }}</td>
      <td>{{ c.email }}</td>
      <td>{{ c.telefono }}</td>
      <td>{{ c.direccion }}</td>
      <td>
        <a href="{% url 'empleados:cliente_detail' c.id %}" class="btn btn-info btn-sm">Ver</a>
        <a href="{% url 'empleados:cliente_edit' c.id %}" class="btn btn-warning btn-sm">Editar</a>
        <a href="{% url 'empleados:cliente_delete' c.id %}" class="btn btn-danger btn-sm">Eliminar</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No hay clientes.</td></tr>
    {% endfor %}
  </tbody>
</table>
