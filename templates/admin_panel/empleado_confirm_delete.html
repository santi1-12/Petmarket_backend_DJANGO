<h5>Eliminar empleado</h5>
<p>¿Estás seguro de que deseas eliminar a <strong>{{ empleado.first_name }} {{ empleado.last_name }}</strong> ({{ empleado.email }})?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Eliminar</button>
  <a href="{% url 'empleados:admin_dashboard' %}?tab=empleados" class="btn btn-secondary">Cancelar</a>
</form>
