<h5>Empleados</h5>
<form method="get" class="mb-2">
  <input type="text" name="q" value="{{ q }}" placeholder="Buscar empleado..." class="form-control" style="max-width:300px;display:inline-block">
  <button class="btn btn-primary btn-sm">Buscar</button>
  <a href="{% url 'empleados:empleado_create' %}" class="btn btn-success btn-sm">Agregar empleado</a>
</form>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Usuario</th>
      <th>Email</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for e in empleados %}
    <tr>
      <td>{{ e.first_name }} {{ e.last_name }}</td>
      <td>{{ e.username }}</td>
      <td>{{ e.email }}</td>
      <td>
        <a href="{% url 'empleados:empleado_detail' e.id %}" class="btn btn-info btn-sm">Ver</a>
        <a href="{% url 'empleados:empleado_edit' e.id %}" class="btn btn-warning btn-sm">Editar</a>
        <a href="{% url 'empleados:empleado_delete' e.id %}" class="btn btn-danger btn-sm">Eliminar</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No hay empleados.</td></tr>
    {% endfor %}
  </tbody>
</table>
