<h5>Eliminar cliente</h5>
<p>¿Estás seguro de que deseas eliminar a <strong>{{ cliente.nombre }}</strong> ({{ cliente.email }})?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Eliminar</button>
  <a href="{% url 'empleados:admin_dashboard' %}?tab=clientes" class="btn btn-secondary">Cancelar</a>
</form>
